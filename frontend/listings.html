<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse ads — PetBikroy</title>
<meta name="description" content="Search thousands of pet ads across Bangladesh. Filter by category, breed, location and price.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='80'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<noscript>
  <div style="max-width:1200px;margin:16px auto;padding:14px 18px;border:1px solid #f6dfb8;background:#fff8ec;border-radius:10px;font:14px/1.5 system-ui,sans-serif;color:#7c5a14">
    <strong>JavaScript is turned off.</strong> PetBikroy renders its listings in your
    browser, so search, filters and posting an ad need JavaScript enabled.
  </div>
</noscript>

<main class="page" id="main">
  <div class="wrap">
    <div id="crumbs"></div>

    <div class="split">

      <!-- ============================== Filters ============================== -->
      <aside class="filters card" id="filters" aria-label="Search filters">
        <div class="filters-head filter-block" style="display:none;align-items:center;gap:10px;border-bottom:1px solid var(--line)">
          <h4 style="margin:0">Filters</h4>
          <button class="icon-btn push" id="closeFilters" aria-label="Close filters">✕</button>
        </div>

        <div class="filter-block">
          <h4>Category</h4>
          <ul class="filter-list" id="catList"></ul>
        </div>

        <div class="filter-block" id="subBlock">
          <h4 id="subTitle">Breed / type</h4>
          <ul class="filter-list" id="subList"></ul>
        </div>

        <div class="filter-block">
          <h4>Location</h4>
          <label class="sr-only" for="fLoc">Division</label>
          <select class="select" id="fLoc"></select>
          <div id="areaWrap" class="mt-8 hide">
            <ul class="filter-list" id="areaList" style="max-height:170px"></ul>
          </div>
        </div>

        <div class="filter-block">
          <h4>Price range</h4>
          <div class="price-range">
            <input class="input" type="number" id="fMin" min="0" placeholder="Min" inputmode="numeric">
            <span class="dash">–</span>
            <input class="input" type="number" id="fMax" min="0" placeholder="Max" inputmode="numeric">
          </div>
          <button class="btn btn-outline btn-sm btn-block mt-8" id="applyPrice">Apply price</button>
        </div>

        <div class="filter-block">
          <h4>Ad type</h4>
          <label class="check"><input type="checkbox" id="fSold"> Include sold ads</label>
        </div>

        <div class="filter-block">
          <button class="btn btn-ghost btn-block" id="clearAll">Clear all filters</button>
        </div>
      </aside>

      <!-- ============================== Results ============================== -->
      <section>
        <div class="results-bar">
          <h1 id="resultTitle">All ads</h1>
          <span class="small muted nowrap" id="resultCount"></span>

          <div class="push row gap-8">
            <div class="mobile-filter-bar">
              <button class="btn btn-outline btn-sm" id="openFilters">Filters</button>
            </div>
            <label class="sr-only" for="fSort">Sort by</label>
            <select class="select" id="fSort" style="width:auto"></select>
            <div class="view-toggle" role="group" aria-label="View">
              <button id="viewGrid" class="is-active" aria-label="Grid view" aria-pressed="true"></button>
              <button id="viewList" aria-label="List view" aria-pressed="false"></button>
            </div>
          </div>
        </div>

        <div class="active-chips" id="chips"></div>
        <div id="results"></div>
        <div class="pager" id="pager"></div>
      </section>

    </div>
  </div>
</main>

<div class="drawer-backdrop" id="filterBackdrop"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/listings.js"></script>
</body>
</html>
