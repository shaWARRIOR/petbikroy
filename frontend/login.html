<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — PetBikroy</title>
<meta name="description" content="Sign in to your PetBikroy account to post pet ads and manage the listings you already have.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='78' font-size='80'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<noscript>
  <div style="max-width:1200px;margin:16px auto;padding:14px 18px;border:1px solid #f6dfb8;background:#fff8ec;border-radius:10px;font:14px/1.5 system-ui,sans-serif;color:#7c5a14">
    <strong>JavaScript is turned off.</strong> Signing in needs JavaScript, because
    the session is established by a scripted request rather than a form post.
  </div>
</noscript>

<main class="page" id="main">
  <div class="wrap">
    <div id="crumbs"></div>

    <div class="card auth-card">
      <h1>Sign in</h1>
      <p class="lead">Use the mobile number you posted your first ad with.</p>

      <div class="form-alert hide" id="formAlert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="req" for="phone">Mobile number</label>
          <input class="input" id="phone" name="phone" type="tel" inputmode="numeric"
                 autocomplete="username" placeholder="01712345678" required>
          <div class="err-msg" data-err="phone"></div>
        </div>

        <div class="field">
          <label class="req" for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
          <div class="err-msg" data-err="password"></div>
        </div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
      </form>

      <p class="auth-alt">
        New to PetBikroy? <a href="register.html">Create a free account</a> — it takes a minute.
      </p>
    </div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
